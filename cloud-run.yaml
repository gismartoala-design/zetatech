apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: zetatech
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        # Autoscaling configuration
        # minScale 0: con trafico casi nulo, mantener una instancia 24/7
        # (minScale 1) cobraba CPU/memoria reservada sin uso real. El costo
        # de volver a minScale 1 es un arranque en frio en la primera visita
        # tras un rato de inactividad; subelo de nuevo cuando haya trafico
        # real que lo justifique.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      containers:
        - image: us-central1-docker.pkg.dev/${PROJECT_ID}/zetatech-repo/zetatech-shop:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_PUBLIC_SITE_URL
              value: "https://tu-dominio.com"
            - name: EMBEDDED_API
              value: "true"
            # La API arranca dentro de la imagen; no requiere otra URL pública.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            # Sin esta variable el sitio no carga Google Analytics.
            - name: GA_MEASUREMENT_ID
              value: "G-XXXXXXXXXX"
            # Opcional: si sirves imágenes desde otro dominio/CDN
            # - name: APP_PUBLIC_ASSET_URL
            #   value: "https://cdn.difiori.com"
            # - name: BACKEND_URL
            #   value: "https://api.difiori.com"
            # ADD DATABASE_URL OR OTHER SECRETS HERE
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: db-secret
            #       key: latest
  traffic:
    - percent: 100
      latestRevision: true
