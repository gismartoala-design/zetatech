name: zetatech

services:
  api:
    build:
      context: ./admin-floreria/api
      dockerfile: Dockerfile
    env_file:
      - ./admin-floreria/api/.env
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
    ports:
      - "4001:4000"
    volumes:
      - zetatech-uploads:/app/uploads
      - zetatech-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      BACKEND_URL: http://api:4000
      EMBEDDED_API: "false"
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    profiles: ["web", "all"]
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin-floreria/client/Dockerfile.compose
      args:
        VITE_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:4001/api}
        VITE_BACKEND_URL: ${VITE_ADMIN_API_URL:-http://localhost:4001/api}
        VITE_URL_IMG: ${VITE_ADMIN_ASSET_URL:-http://localhost:4001}
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    profiles: ["admin", "all"]
    restart: unless-stopped

volumes:
  zetatech-uploads:
  zetatech-logs:
